<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
      <title>El Vasito Dieciochero</title>

        <meta name="theme-color" content="#181824">
          <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

                <link rel="manifest" href='data:application/manifest+json,{"name":"El Vasito","short_name":"Vasito","start_url":".","display":"standalone","background_color":"#181824","theme_color":"#181824","icons":[{"src":"https://fav.farm/🍷","sizes":"192x192","type":"image/png"}]}'>

                  <style>
                      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
                          body {
                                background: #181824;
                                      color: #ffffff;
                                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                                                  min-height: 100vh;
                                                        display: flex;
                                                              flex-direction: column;
                                                                    align-items: center;
                                                                          justify-content: center;
                                                                                padding: 20px;
                                                                                    }
                                                                                        h1 { font-size: 1.5rem; margin-bottom: 4px; }
                                                                                            p.subtitle { font-size: 0.85rem; color: #a0a0c0; margin-bottom: 20px; }

                                                                                                .canvas-container {
                                                                                                      position: relative;
                                                                                                            width: 200px;
                                                                                                                  height: 280px;
                                                                                                                        margin-bottom: 20px;
                                                                                                                            }
                                                                                                                                canvas {
                                                                                                                                      width: 100%;
                                                                                                                                            height: 100%;
                                                                                                                                                }

                                                                                                                                                    .countdown-grid {
                                                                                                                                                          display: grid;
                                                                                                                                                                grid-template-columns: repeat(4, 1fr);
                                                                                                                                                                      gap: 10px;
                                                                                                                                                                            width: 100%;
                                                                                                                                                                                  max-width: 320px;
                                                                                                                                                                                        margin-bottom: 20px;
                                                                                                                                                                                            }
                                                                                                                                                                                                .time-card {
                                                                                                                                                                                                      background: rgba(255, 255, 255, 0.07);
                                                                                                                                                                                                            padding: 10px 4px;
                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                              border: 1px solid rgba(255, 255, 255, 0.1);
                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                      .time-num { font-size: 1.3rem; font-weight: 700; color: #ff7e5f; display: block; }
                                                                                                                                                                                                                                          .time-label { font-size: 0.65rem; text-transform: uppercase; color: #8a8aab; margin-top: 2px; }

                                                                                                                                                                                                                                              .pip-btn {
                                                                                                                                                                                                                                                    background: linear-gradient(135deg, #ff7e5f, #feb47b);
                                                                                                                                                                                                                                                          color: #181824;
                                                                                                                                                                                                                                                                border: none;
                                                                                                                                                                                                                                                                      padding: 12px 20px;
                                                                                                                                                                                                                                                                            border-radius: 25px;
                                                                                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                                                                                        font-size: 0.9rem;
                                                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                                                    box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                            .pip-btn:active { transform: scale(0.96); }
                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                              </head>
                                                                                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                                                                                                <h1>🇨🇱 Camino al 18 🇨🇱</h1>
                                                                                                                                                                                                                                                                                                                  <p class="subtitle">Modo Vasito Dieciochero</p>

                                                                                                                                                                                                                                                                                                                    <div class="canvas-container">
                                                                                                                                                                                                                                                                                                                        <canvas id="glassCanvas" width="200" height="280"></canvas>
                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                            <div class="countdown-grid">
                                                                                                                                                                                                                                                                                                                                <div class="time-card"><span class="time-num" id="days">00</span><span class="time-label">Días</span></div>
                                                                                                                                                                                                                                                                                                                                    <div class="time-card"><span class="time-num" id="hours">00</span><span class="time-label">Horas</span></div>
                                                                                                                                                                                                                                                                                                                                        <div class="time-card"><span class="time-num" id="minutes">00</span><span class="time-label">Min</span></div>
                                                                                                                                                                                                                                                                                                                                            <div class="time-card"><span class="time-num" id="seconds">00</span><span class="time-label">Seg</span></div>
                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                <button class="pip-btn" id="pipBtn">📌 Dejar Vasito Flotando</button>

                                                                                                                                                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                                                                                                                                                      const canvas = document.getElementById('glassCanvas');
                                                                                                                                                                                                                                                                                                                                                          const ctx = canvas.getContext('2d');
                                                                                                                                                                                                                                                                                                                                                              let progress = 0;

                                                                                                                                                                                                                                                                                                                                                                  function getDates() {
                                                                                                                                                                                                                                                                                                                                                                        const now = new Date();
                                                                                                                                                                                                                                                                                                                                                                              let year = now.getFullYear();
                                                                                                                                                                                                                                                                                                                                                                                    const target = new Date(year, 8, 18, 0, 0, 0);

                                                                                                                                                                                                                                                                                                                                                                                          if (now > target && now.getMonth() === 8 && now.getDate() > 18) {
                                                                                                                                                                                                                                                                                                                                                                                                  target.setFullYear(year + 1);
                                                                                                                                                                                                                                                                                                                                                                                                          year++;
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                      const start = new Date(target.getTime() - (30 * 24 * 60 * 60 * 1000));
                                                                                                                                                                                                                                                                                                                                                                                                                            return { start, target, now };
                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                    function drawGlass(prog) {
                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.clearRect(0, 0, canvas.width, canvas.height);

                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.lineWidth = 4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.moveTo(30, 20);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.lineTo(45, 240);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.lineTo(155, 240);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineTo(170, 20);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.stroke();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.fillRect(40, 240, 120, 10);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (prog > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const fillHeight = (215 * prog) / 100;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const topY = 235 - fillHeight;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const leftX = 45 - ((45 - 30) * (fillHeight / 215));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const rightX = 155 + ((170 - 155) * (fillHeight / 215));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const gradient = ctx.createLinearGradient(0, topY, 0, 235);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            gradient.addColorStop(0, "#ff7e5f");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    gradient.addColorStop(1, "#feb47b");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle = gradient;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.moveTo(leftX, topY);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineTo(rightX, topY);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.lineTo(155, 235);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineTo(45, 235);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle = "#fffdf0";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.ellipse((leftX + rightX) / 2, topY, (rightX - leftX) / 2, 8, 0, 0, Math.PI * 2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle = "#ffffff";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.font = "bold 26px sans-serif";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.textAlign = "center";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.shadowColor = "black";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.shadowBlur = 4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.fillText(`${Math.floor(prog)}%`, 100, 130);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.shadowBlur = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function update() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const { start, target, now } = getDates();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const total = target - start;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const elapsed = now - start;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const remaining = target - now;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          progress = (elapsed / total) * 100;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (progress < 0) progress = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (progress > 100) progress = 100;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            drawGlass(progress);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (remaining > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('days').innerText = String(Math.floor(remaining / (1000 * 60 * 60 * 24))).padStart(2, '0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('hours').innerText = String(Math.floor((remaining / (1000 * 60 * 60)) % 24)).padStart(2, '0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('minutes').innerText = String(Math.floor((remaining / 1000 / 60) % 60)).padStart(2, '0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('seconds').innerText = String(Math.floor((remaining / 1000) % 60)).padStart(2, '0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setInterval(update, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    update();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('pipBtn').addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const video = document.createElement('video');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              video.srcObject = canvas.captureStream();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      video.muted = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              await video.play();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await video.requestPictureInPicture();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Tu navegador no soporta flotar la ventana directamente o requiere interacción previa.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
