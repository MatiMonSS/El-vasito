<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>El Vasito Dieciochero</title>

  <meta name="theme-color" content="#181824">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href='data:application/manifest+json,{"name":"El Vasito","short_name":"Vasito","start_url":".","display":"standalone","background_color":"#181824","theme_color":"#181824","icons":[{"src":"https://fav.farm/🍷","sizes":"192x192","type":"image/png"}]}'>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #181824;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .canvas-container {
      position: relative;
      width: 160px;
      height: 210px;
      margin-bottom: 15px;
    }
    canvas {
      width: 100%;
      height: 100%;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }
    .time-card {
      background: rgba(255, 255, 255, 0.07);
      padding: 8px 4px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .time-num { font-size: 1.2rem; font-weight: 700; color: #ff7e5f; display: block; }
    .time-label { font-size: 0.6rem; text-transform: uppercase; color: #8a8aab; margin-top: 2px; }

    .pip-btn {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      color: #181824;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
    }
    .pip-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="canvas-container">
    <canvas id="glassCanvas" width="160" height="210"></canvas>
  </div>

  <div class="countdown-grid">
    <div class="time-card"><span class="time-num" id="days">00</span><span class="time-label">Días</span></div>
    <div class="time-card"><span class="time-num" id="hours">00</span><span class="time-label">Horas</span></div>
    <div class="time-card"><span class="time-num" id="minutes">00</span><span class="time-label">Min</span></div>
    <div class="time-card"><span class="time-num" id="seconds">00</span><span class="time-label">Seg</span></div>
  </div>

  <button class="pip-btn" id="pipBtn">📌 Dejar Vasito Flotando</button>

  <script>
    const canvas = document.getElementById('glassCanvas');
    const ctx = canvas.getContext('2d');
    let progress = 0;

    function getDates() {
      const now = new Date();
      let year = now.getFullYear();
      const target = new Date(year, 8, 18, 0, 0, 0);

      if (now > target && now.getMonth() === 8 && now.getDate() > 18) {
        target.setFullYear(year + 1);
        year++;
      }

      const start = new Date(target.getTime() - (30 * 24 * 60 * 60 * 1000));
      return { start, target, now };
    }

    function drawGlass(prog) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fondo oscuro para que resalte en el flotante
      ctx.fillStyle = "#181824";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Título en el flotante
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🇨🇱 CAMINO AL 18 🇨🇱", 80, 18);

      // Vaso (Contorno más pequeño)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(30, 32);
      ctx.lineTo(42, 190);
      ctx.lineTo(118, 190);
      ctx.lineTo(130, 32);
      ctx.stroke();

      // Base del vaso
      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      ctx.fillRect(38, 190, 84, 8);

      // Líquido
      if (prog > 0) {
        const fillHeight = (152 * prog) / 100;
        const topY = 186 - fillHeight;

        const leftX = 42 - ((42 - 30) * (fillHeight / 152));
        const rightX = 118 + ((130 - 118) * (fillHeight / 152));

        const gradient = ctx.createLinearGradient(0, topY, 0, 186);
        gradient.addColorStop(0, "#ff7e5f");
        gradient.addColorStop(1, "#feb47b");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(leftX, topY);
        ctx.lineTo(rightX, topY);
        ctx.lineTo(118, 186);
        ctx.lineTo(42, 186);
        ctx.closePath();
        ctx.fill();

        // Helado / Espuma
        ctx.fillStyle = "#fffdf0";
        ctx.beginPath();
        ctx.ellipse((leftX + rightX) / 2, topY, (rightX - leftX) / 2, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Porcentaje
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "black";
      ctx.shadowBlur = 4;
      ctx.fillText(`${Math.floor(prog)}%`, 80, 115);
      ctx.shadowBlur = 0;
    }

    function update() {
      const { start, target, now } = getDates();
      const total = target - start;
      const elapsed = now - start;
      const remaining = target - now;

      progress = (elapsed / total) * 100;
      if (progress < 0) progress = 0;
      if (progress > 100) progress = 100;

      drawGlass(progress);

      if (remaining > 0) {
        document.getElementById('days').innerText = String(Math.floor(remaining / (1000 * 60 * 60 * 24))).padStart(2, '0');
        document.getElementById('hours').innerText = String(Math.floor((remaining / (1000 * 60 * 60)) % 24)).padStart(2, '0');
        document.getElementById('minutes').innerText = String(Math.floor((remaining / 1000 / 60) % 60)).padStart(2, '0');
        document.getElementById('seconds').innerText = String(Math.floor((remaining / 1000) % 60)).padStart(2, '0');
      }
    }

    setInterval(update, 1000);
    update();

    document.getElementById('pipBtn').addEventListener('click', async () => {
      try {
        const video = document.createElement('video');
        video.srcObject = canvas.captureStream();
        video.muted = true;
        await video.play();
        await video.requestPictureInPicture();
      } catch (err) {
        alert("Tu navegador no soporta flotar la ventana directamente o requiere interacción previa.");
      }
    });
  </script>
</body>
</html>
